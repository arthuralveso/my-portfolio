<header class="bar" [class.on-dark]="open()">
  <a class="brand" routerLink="/" aria-label="Arthur Alves — home">
    <span class="brand-name">ArthurAlvesDev</span>
  </a>

  <div class="right">
    <a class="resume mono" [href]="profile.resume" download
      >{{ ui.resumePdf }} <lucide-icon [img]="icons.ArrowDown"
    /></a>

    <button
      class="theme-btn"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? ui.themeLight : ui.themeDark"
    >
      <lucide-icon [img]="theme.theme() === 'dark' ? icons.Sun : icons.Moon" />
    </button>

    <button
      class="menu-btn"
      type="button"
      (click)="toggle()"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="open() ? ui.close : ui.menu"
      aria-controls="menu"
    >
      <span class="burger" [class.x]="open()"><i></i><i></i><i></i></span>
    </button>
  </div>
</header>

<nav
  id="menu"
  class="overlay"
  [class.open]="open()"
  [attr.inert]="open() ? null : ''"
  aria-label="Main"
>
  <ol class="links">
    @for (item of nav; track item.path; let i = $index) {
      <li [style.--i]="i">
        <a
          [routerLink]="item.path"
          routerLinkActive="current"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          (click)="close()"
        >
          <span class="label display">{{ item.label }}</span>
          <span class="desc">{{ item.desc }}</span>
        </a>
      </li>
    }
  </ol>

  <div class="menu-foot mono">
    <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
    <a [href]="profile.linkedin" target="_blank" rel="noopener"
      >LinkedIn <lucide-icon [img]="icons.ArrowUpRight"
    /></a>
    <a [href]="profile.resume" download
      >{{ ui.resumePdf }} <lucide-icon [img]="icons.ArrowDown"
    /></a>
  </div>
</nav>
